appId: com.convert.app
productName: Convert
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Native binaries must live outside app.asar to be executable. Other branches add these deps.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/sharp/**
  - node_modules/@img/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  artifactName: Convert-Setup-${version}.${ext}
  include: build/installer.nsh
portable:
  artifactName: Convert-${version}-portable.${ext}
